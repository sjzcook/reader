name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Reader/**"
      - "ShareExtension/**"
      - "project.yml"
      - ".github/workflows/build-ios-unsigned.yml"

permissions:
  contents: read

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    # Xcode 27 image runs on Apple Silicon (arm64) with macOS 27.
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          test -d Reader.xcodeproj
          xcodebuild -list -project Reader.xcodeproj

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project Reader.xcodeproj \
            -scheme Reader 2>&1 | tee resolve-packages.log

      - name: Build unsigned iOS app
        id: build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p dist/ios
          xcodebuild \
            -project Reader.xcodeproj \
            -scheme Reader \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee dist/ios/build.log

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/ModuReader.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "::error::Expected app bundle not found: $APP_PATH"
            find build/DerivedData/Build/Products -maxdepth 4 -name '*.app' -print || true
            exit 1
          fi

          rm -rf dist/ios/Payload
          mkdir -p dist/ios/Payload
          /usr/bin/ditto "$APP_PATH" dist/ios/Payload/ModuReader.app
          (
            cd dist/ios
            /usr/bin/zip -qry ModuReader-unsigned.ipa Payload
          )

          test -s dist/ios/ModuReader-unsigned.ipa
          echo "IPA package created:"
          ls -lh dist/ios/ModuReader-unsigned.ipa
          echo "Embedded app extensions:"
          find dist/ios/Payload/ModuReader.app -maxdepth 4 -name '*.appex' -print || true

      - name: Write build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Unsigned iOS IPA build"
            echo
            echo "- Repository: ${{ github.repository }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Xcode: $(xcodebuild -version | head -1)"
            echo "- Scheme: Reader"
            echo "- Signing: disabled (CODE_SIGNING_ALLOWED=NO)"
            echo
            if [[ -s dist/ios/ModuReader-unsigned.ipa ]]; then
              echo "Result: IPA created successfully."
              echo
              echo '---'
              ls -lh dist/ios/ModuReader-unsigned.ipa
            else
              echo "Result: IPA was not created. See the build log artifact for details."
              if [[ -f dist/ios/build.log ]]; then
                echo
                echo '### Recent compiler errors'
                echo '---'
                grep -E 'error:|fatal error:|BUILD FAILED|SwiftCompile failed' dist/ios/build.log | tail -80 || true
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ModuReader-unsigned-ipa-${{ github.run_number }}
          path: |
            dist/ios/ModuReader-unsigned.ipa
            dist/ios/build.log
            resolve-packages.log
          if-no-files-found: warn
          retention-days: 14
