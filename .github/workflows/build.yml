name: Build

# 在 GitHub 的 macOS runner 上跑 xcodegen + xcodebuild。
# 本地是 Windows 时，这是拿编译反馈最省事的办法（公开仓库免费）。
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        run: |
          ls /Applications | grep -i xcode
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || \
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        run: xcodegen generate

      - name: 缓存 SPM 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: 解析依赖
        run: |
          xcodebuild -project Reader.xcodeproj \
            -scheme Reader \
            -resolvePackageDependencies

      - name: 编译（不签名）
        run: |
          set -o pipefail
          xcodebuild build \
            -project Reader.xcodeproj \
            -scheme Reader \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build.log \
            | xcbeautify --renderer github-actions || true

      - name: 汇总错误
        if: always()
        run: |
          if grep -q "BUILD SUCCEEDED" build.log; then
            echo "### ✅ 编译通过" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ 编译失败" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "error:" build.log | head -60 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: 上传工程文件
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Reader-xcodeproj
          path: Reader.xcodeproj
          retention-days: 7
